[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mo2-modlists"
version = "0.1.0"
description = "Portable, verified MO2 profile snapshots"
requires-python = ">=3.12"

[project.scripts]
mo2-modlists = "mo2_modlists.cli:main"

[tool.setuptools.packages.find]
include = ["mo2_modlists*"]
