[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mo2-modlists"
version = "0.10.0"
description = "Source manifests for MO2 modlists"
requires-python = ">=3.12"

[project.scripts]
mo2-modlists = "mo2_modlists.cli:main"

[tool.setuptools.packages.find]
include = ["mo2_modlists*"]

[tool.setuptools.package-data]
mo2_modlists = ["*.schema.json", "_vendor/README.md", "_vendor/resolvelib/LICENSE", "_vendor/semantic_version/LICENSE"]
